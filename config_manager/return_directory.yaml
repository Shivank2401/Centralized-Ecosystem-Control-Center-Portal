# Return directory — Amazon FBA customer returns taxonomy
# Manage Amazon reason-code mapping + customer-comment grouping here.
# Future return_database.py should load this file (no hardcoded maps).
#
# Matching order for customer-comments:
#   1. clean text (HTML unescape, unicode normalize, whitespace collapse)
#   2. exact alias match (normalized) under customer_comment_groups.*.aliases
#   3. structured Amazon prefix before first '|' (structured_comment_prefixes)
#   4. keyword regexes (first match wins; group order below)
#   5. else -> Unmapped (+ alert when alerts.on_unknown_comment is true)
#
# Matching for reason column:
#   lookup return_reason_mapping; unknown -> alerts.unknown_reason_group + alert

version: 1

alerts:
  enabled: true
  on_unknown_reason: true
  on_unknown_comment: true
  unknown_reason_group: Unmapped Reason
  unknown_comment_group: Unmapped
  collect_unknowns: true
  # Suggested log lines when wiring the report:
  #   ALERT unknown return reason: <REASON_CODE>
  #   ALERT unknown customer comment: <cleaned text>

cleaning:
  html_unescape: true
  unicode_normalize: NFKC
  collapse_whitespace: true
  treat_as_empty:
    - ""
    - nan
    - none
    - null
    - n/a
    - na

# Amazon `reason` codes from FBA customer returns -> business group
return_reason_mapping:
  DEFECTIVE: Product Quality / Defective
  DAMAGED_BY_FC: Damaged
  NOT_AS_DESCRIBED: Product Issue
  APPAREL_TOO_LARGE: Size / Fit Issue
  APPAREL_TOO_SMALL: Size / Fit Issue
  POOR_FIT: Size / Fit Issue
  ORDERED_WRONG_ITEM: Customer Ordered Wrong Item
  MISSED_ESTIMATED_DELIVERY: Delivery Issue
  UNDELIVERABLE_UNKNOWN: Delivery Issue
  UNAUTHORIZED_PURCHASE: Customer Changed Mind
  NOT_COMPATIBLE: Product Issue
  DAMAGED_BY_CARRIER: Damaged
  QUALITY_UNACCEPTABLE: Product Quality / Defective
  NO_REASON_GIVEN: No Reason Provided
  NEVER_ARRIVED: Delivery Issue
  SWITCHEROO: Wrong / Different Item
  FOUND_BETTER_PRICE: Customer Changed Mind
  MISSING_PARTS: Missing Parts / Incomplete
  UNDELIVERABLE_REFUSED: Delivery Issue
  EXTRA_ITEM: Wrong / Different Item
  MISORDERED: Customer Ordered Wrong Item
  UNDELIVERABLE_CARRIER_MISS_SORTED: Delivery Issue
  WRONG_SIZE: Size / Fit Issue
  UNDELIVERABLE_UNCLAIMED: Delivery Issue
  UNWANTED_ITEM: Customer Changed Mind

structured_comment_prefixes:
  Incorrect Size: wrong_size_ordered
  Not as Expected: not_as_expected
  Changed Mind: no_longer_needed_changed_mind
  Delivery Issue: delivery_late
  Damaged: damaged_packaging_or_product
  Defective: defective_quality
  Ordering Issue: accidental_unauthorized_purchase
  Received Wrong Item: wrong_item_received

