# Per-client geography settings (geo × channel).
#
# Same client + same geo can have multiple channels (amazon, shopify, …).
# Report COGS always resolve to local files (never Excel):
#   cogs/{client}/{geo}_{channel}_cogs.parquet|.csv
#   e.g. cogs/knc/uk_amazon_cogs.csv , cogs/knc/uk_shopify_cogs.csv
#
# excel_sheet = optional legacy workbook sheet name for want_to_update (Excel → Azure) only.
# orders_sales_channel = Amazon (and similar) sales-channel filter for that channel.
# markets / vendors = Shopify Market + Product vendor filters for that channel.
geographies:
  ESH:
    US:
      country_code: US
      country_currency: USD
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: ESH-USA
          orders_sales_channel: Amazon.com
    UK:
      country_code: UK
      country_currency: GBP
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: ESH-UK
          orders_sales_channel: Amazon.co.uk
    DE:
      country_code: DE
      country_currency: EUR
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: ESH-DE
          orders_sales_channel: Amazon.de
    AE:
      country_code: AE
      country_currency: AED
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: ESH-UAE
          orders_sales_channel: Amazon.ae
    CA:
      country_code: CA
      country_currency: CAD
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: ESH-CA
          orders_sales_channel: Amazon.ca
    IN:
      country_code: IN
      country_currency: INR
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: ESH-IN
          orders_sales_channel: Amazon.in

  KNC:
    UK:
      country_code: UK
      country_currency: GBP
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: Main
          orders_sales_channel: Amazon.co.uk
        shopify:
          excel_sheet: Shopify
          # Shopify CSV: Market + Product vendor (renamed sales-channel in ETL)
          markets:
            - United Kingdom
          vendors:
            - Kinetica - UK
            - Kinetica Sports UK
    IE:
      country_code: IE
      country_currency: EUR
      enabled: true
      default_channel: shopify
      channels:
        shopify:
          excel_sheet: Shopify
          markets:
            - Ireland
            - International
          vendors:
            - Kinetica - IE
            - Kinetica Sports
            - Kinetica Sports IE
    DE:
      country_code: DE
      country_currency: EUR
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: Germany-COGS
          orders_sales_channel: Amazon.de
    AE:
      country_code: AE
      country_currency: AED
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: KCA-AE
          orders_sales_channel: Amazon.ae

  EMM:
    AE:
      country_code: AE
      country_currency: AED
      enabled: true
      default_channel: amazon
      channels:
        amazon:
          excel_sheet: EMAMI-AE
          orders_sales_channel: Amazon.ae
