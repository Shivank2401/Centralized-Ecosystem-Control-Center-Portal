# Report registry — maps CLI choices to scripts / output folders.
report_stages:
  common:
    label: 'Stage: Amazon Reports'
    order: 1
    enabled: true
    clients:
    - ESH
    - KNC
  helper_files_nd_saving:
    label: 'Stage: Helper Files nd Saving'
    order: 2
    enabled: true
    clients:
    - ESH
    - KNC
  retail:
    label: 'Stage: Retail'
    order: 3
    enabled: true
    clients:
    - ESH
  item_master:
    label: 'Stage: item_master'
    order: 4
    clients:
    - ESH
    - KNC
  finance:
    label: 'Stage: Finance'
    order: 5
    enabled: true
    clients:
    - ESH
  want_to_update:
    label: 'Stage: Want to Update'
    order: 7
    enabled: true
    clients:
    - ESH
    - KNC
  requirement_specific:
    label: 'Stage: Requirement Specific'
    order: 6
    enabled: true
    clients:
    - ESH
    - KNC
    - EMM
  atros:
    label: 'Stage: atros (KNC PNL / ads / decomp)'
    order: 9
    clients:
    - KNC
  utility_codes:
    label: 'Stage: utility_codes'
    order: 8
  shopify_reports:
    label: 'Stage: Shopify Reports'
    order: 10
    enabled: true
    clients:
    - KNC
