# Client registry — paths come from .env via data_root_env / cogs_path_env
clients:
  ESH:
    name: Ecosoul Home
    client_id: "TH-1755734939046"
    enabled: true
    data_root_env: ESH_DATA_ROOT
    cogs_path_env: ESH_COGS_PATH
    package: client_esh
    layout: esh
    geographies: [US, UK, DE, AE, CA, IN]

  KNC:
    name: Kinetica
    client_id: "TH-1753144646395"
