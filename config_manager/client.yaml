    layout: knc
    geographies: [UK, DE, AE]

  EMM:
    name: Emami UAE
    client_id: "TH-1783660475608"
    enabled: true
    data_root_env: EMAMI_DATA_ROOT
    cogs_path_env: EMAMI_COGS_PATH
    package: client_emm
    layout: emm
    geographies: [AE]
